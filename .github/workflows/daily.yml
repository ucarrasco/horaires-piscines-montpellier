name: Refresh schedules + deploy

on:
  schedule:
    - cron: "0 4 * * *" # every day at 04:00 UTC (~06:00 in Montpellier)
  workflow_dispatch: {} # manual trigger
  push:
    branches: [main]

# One deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # to commit the regenerated JSON
  pages: write # to deploy to GitHub Pages
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate the schedules (skipped on a plain push, to save API calls).
      - name: Scrape schedules
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run scrape

      - name: Commit schedules if changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public/data/schedules.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/schedules.json
            git commit -m "chore: update pool schedules [skip ci]"
            git push
          else
            echo "No schedule changes."
          fi

      # SITE_URL drives Vite's base, the canonical URLs, the sitemap and the
      # CNAME file. Set it as a repository variable when moving to a custom
      # domain; without it the build targets the default github.io URL.
      - name: Build and prerender
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

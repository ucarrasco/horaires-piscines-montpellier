name: Refresh schedules + deploy

on:
  schedule:
    - cron: "0 4 * * *" # every day at 04:00 UTC (~06:00 in Montpellier)
  workflow_dispatch: {} # manual trigger
  push:
    branches: [main]

# One deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # to commit the regenerated JSON
  pages: write # to deploy to GitHub Pages
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate the schedules (skipped on a plain push, to save API calls).
      #
      # Exits non-zero when a pool could not be scraped, but the JSON is still
      # written: continue-on-error lets the pools that worked reach the site,
      # and the last step of the job turns the run red so the failure is seen.
      - name: Scrape schedules
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run scrape

      - name: Commit schedules if changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public/data/schedules.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/schedules.json
            git commit -m "chore: update pool schedules [skip ci]"
            git push
          else
            echo "No schedule changes."
          fi

      # SITE_URL drives Vite's base, the canonical URLs, the sitemap and the
      # CNAME file. Set it as a repository variable when moving to a custom
      # domain; without it the build targets the default github.io URL.
      - name: Build and prerender
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

      # Last on purpose: the site has already shipped the pools that worked.
      # Failing here marks the run red, which is what triggers GitHub's
      # "workflow failed" email (Settings > Notifications > Actions).
      - name: Report pools that could not be scraped
        if: steps.scrape.outcome == 'failure'
        run: |
          node -e '
            const d = require("./public/data/schedules.json");
            const bad = d.pools.filter((p) => p.status !== "ok");
            const lines = bad.length
              ? bad.map((p) => `- **${p.name}** — \`${p.error}\``).join("\n")
              : "- The scrape step failed before writing any result (missing API key? network down?).";
            console.log(`## ❌ ${bad.length}/${d.pools.length} pool(s) failed\n\n${lines}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::At least one pool could not be scraped — see the job summary."
          exit 1

name: Refresh schedules + deploy

on:
  schedule:
    - cron: "0 4 * * *" # every day at 04:00 UTC (~06:00 in Montpellier)
  workflow_dispatch: {} # manual trigger
  push:
    branches: [main]

# One deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # to commit the regenerated JSON
  pages: write # to deploy to GitHub Pages
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate the schedules (skipped on a plain push, to save API calls).
      #
      # Exits non-zero when a pool could not be scraped, but the JSON is still
      # written (a pool that failed keeps its previous read, see scrape.ts):
      # continue-on-error lets it reach the site, and the last step of the job
      # reports the failure and turns the run red.
      - name: Scrape schedules
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run scrape

      - name: Commit schedules if changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public/data/schedules.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/schedules.json
            git commit -m "chore: update pool schedules [skip ci]"
            # main may have moved while the scrape ran (~15 API calls).
            git pull --rebase origin main
            git push
          else
            echo "No schedule changes."
          fi

      # SITE_URL drives Vite's base, the canonical URLs, the sitemap and the
      # CNAME file. Set it as a repository variable when moving to a custom
      # domain; without it the build targets the default github.io URL.
      - name: Build and prerender
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

      # Last on purpose: the site has already shipped whatever could be built.
      # Runs whenever something went wrong: a pool that could not be read (the
      # scrape step is continue-on-error, hence the explicit check) or a failed
      # build/deploy. Posts to Discord and exits non-zero on a scrape failure,
      # so that the run shows red too.
      - name: Report failures
        if: failure() || steps.scrape.outcome == 'failure'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRAPE_FAILED: ${{ steps.scrape.outcome == 'failure' }}
          JOB_FAILED: ${{ job.status == 'failure' }}
        run: node scripts/notify.mjs

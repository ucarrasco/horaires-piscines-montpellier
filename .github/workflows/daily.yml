name: Refresh schedules + deploy

on:
  schedule:
    - cron: "0 4 * * *" # every day at 04:00 UTC (~06:00 in Montpellier)
  workflow_dispatch: {} # manual trigger
  push:
    branches: [main]

# One deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # to commit the regenerated JSON
  pages: write # to deploy to GitHub Pages
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scrape_failed: ${{ steps.scrape.outcome == 'failure' }}
      # The commit holding the schedules this run wrote, for the report job.
      sha: ${{ steps.commit.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate the schedules (skipped on a plain push, to save API calls).
      #
      # Exits non-zero when a pool could not be scraped, but the JSON is still
      # written (a pool that failed keeps its previous read, see scrape.ts):
      # continue-on-error lets it reach the site, and the report job reports
      # the failure and turns the run red.
      - name: Scrape schedules
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run scrape

      - name: Commit schedules if changed
        id: commit
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public/data/schedules.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/schedules.json
            git commit -m "chore: update pool schedules [skip ci]"
            # main may have moved while the scrape ran (~15 API calls).
            git pull --rebase origin main
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "No schedule changes."
          fi

      # SITE_URL drives Vite's base, the canonical URLs, the sitemap and the
      # CNAME file. Set it as a repository variable when moving to a custom
      # domain; without it the build targets the default github.io URL.
      - name: Build and prerender
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A job of its own: deploy-pages run in the same job as the upload
  # intermittently finds no artifact (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Last on purpose: the site has already shipped whatever could be built.
  # Runs whenever something went wrong: a pool that could not be read (the
  # scrape step is continue-on-error, hence the explicit check) or a failed
  # build/deploy. Posts to Discord and exits non-zero on a scrape failure,
  # so that the run shows red too.
  report:
    needs: [build, deploy]
    if: >-
      always() && (
        needs.build.result != 'success' ||
        needs.deploy.result != 'success' ||
        needs.build.outputs.scrape_failed == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      # notify.mjs reads the schedules this run wrote, which may sit in a
      # commit pushed after the run started.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha || github.sha }}

      - name: Report failures
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRAPE_FAILED: ${{ needs.build.outputs.scrape_failed }}
          JOB_FAILED: ${{ needs.build.result == 'failure' || needs.deploy.result == 'failure' }}
        run: node scripts/notify.mjs
